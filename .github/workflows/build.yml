name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch Barlow fonts (SIL Open Font License)
        run: |
          mkdir -p app/src/main/res/font
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL $base/barlow/Barlow-Regular.ttf -o app/src/main/res/font/barlow_regular.ttf
          curl -fsSL $base/barlow/Barlow-Medium.ttf -o app/src/main/res/font/barlow_medium.ttf
          curl -fsSL $base/barlowcondensed/BarlowCondensed-Light.ttf -o app/src/main/res/font/barlow_condensed_light.ttf
          curl -fsSL $base/barlowcondensed/BarlowCondensed-Medium.ttf -o app/src/main/res/font/barlow_condensed_medium.ttf

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Package
        id: pkg
        run: |
          v="0.1.${GITHUB_RUN_NUMBER}"
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/Z370-Launcher-v${v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/Z370-Launcher-latest.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Z370 Launcher v${{ steps.pkg.outputs.version }}
          make_latest: true
          files: out/*
